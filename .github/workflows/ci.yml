name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders only. src/lib/env.ts validates at import time, so a build needs
      # syntactically valid values — never real secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
      CNIC_PEPPER: ci-placeholder-cnic-pepper
      CNIC_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit tests run without a database or a .env — see vitest.config.mts.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
