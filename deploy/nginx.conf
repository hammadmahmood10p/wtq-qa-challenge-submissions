# TLS termination and the front door.
#
# Docker's embedded DNS resolves `app` to every replica, so `upstream` here load
# balances across however many were started with `--scale app=N` without this file
# needing to know the number.

# Stop announcing the exact version in the Server header and on error pages.
#
# This is hardening, not a fix. It does not patch anything — it only removes the
# banner a scanner reads to decide which CVEs to report. The actual remediation for
# the five High findings of 1 Oct 2026 is the version bump in docker-compose.yml, and
# this line must never be mistaken for it: an unpatched nginx that declines to state
# its version is exactly as vulnerable as one that does.
server_tokens off;

upstream wtq_app {
    server app:3000;
    keepalive 32;
}

# Everything on http goes to https. The container's own probe is the one exception,
# and only from inside the container.
server {
    listen 80;
    server_name _;

    # The assessment of 1 Oct 2026 raised two findings against this one location, both
    # correct: it answered 200 instead of redirecting ("HTTP to HTTPS Redirect Not
    # Enabled"), and it answered with application/octet-stream, nginx's default_type
    # fallback ("Missing Content-Type Header").
    #
    # It cannot simply redirect, because docker-compose.yml's healthcheck calls it over
    # http on loopback and would then see a 301 and mark nginx unhealthy. So the probe
    # keeps its 200 for loopback only, and everyone else — including a scanner — gets
    # the redirect every other path gets.
    #
    # `if` inside a location is the documented-safe case: a bare return, nothing else.
    location /healthz {
        access_log off;
        default_type text/plain;

        if ($remote_addr !~ "^(127\.0\.0\.1|::1)$") {
            return 301 https://$host$request_uri;
        }

        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Every suite here is ECDHE and AEAD, which is what closes the two cipher findings
    # of 1 Oct 2026.
    #
    # `HIGH:!aNULL:!MD5` was the problem: HIGH is an OpenSSL grouping by key length,
    # not by quality, so it still admits static-RSA suites that carry no forward
    # secrecy — recover the server key and every past session decrypts — alongside CBC
    # suites with their own history. Naming the suites is the only way to be sure what
    # is on offer.
    #
    # The floor this sets is a client that supports TLS 1.2 with ECDHE, which means
    # roughly anything from 2014 onwards. Participants bring their own laptops, so
    # that bound was checked rather than assumed before narrowing it.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Let the client choose among these. They are all strong, and the client knows
    # best which it has hardware acceleration for — ChaCha20 on a phone, AES-GCM on a
    # laptop.
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # Tickets are reused across restarts and weaken the forward secrecy the suites
    # above exist to provide.
    ssl_session_tickets off;

    # The app sets its own X-Frame-Options, Referrer-Policy and X-Content-Type-Options
    # (next.config.ts). HSTS belongs here, because only this layer knows TLS is on.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Challenge 2 accepts a 20MB PDF, and the server action wrapping it adds overhead.
    # nginx's default is 1MB, which would reject every report with a 413 before the
    # application ever saw it.
    client_max_body_size 25m;

    # An upload from a venue on poor wifi can be slow without being stuck.
    client_body_timeout 120s;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    location /healthz {
        access_log off;
        # Same Content-Type finding as the http probe: without this, nginx falls back
        # to default_type, which is application/octet-stream.
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://wtq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the application believes every request arrived over http and
        # will not set its Secure session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js streams server-rendered HTML. Buffering it would hold each page back
        # until it was complete, which on the challenge workspace is exactly wrong.
        proxy_buffering off;
    }

    # Immutable build assets: hashed filenames, so a long cache is safe and takes the
    # static load off Node entirely.
    location /_next/static/ {
        proxy_pass http://wtq_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
