# TLS termination and the front door.
#
# Docker's embedded DNS resolves `app` to every replica, so `upstream` here load
# balances across however many were started with `--scale app=N` without this file
# needing to know the number.

upstream wtq_app {
    server app:3000;
    keepalive 32;
}

# Everything on http goes to https, except the load balancer's own probe.
server {
    listen 80;
    server_name _;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # The app sets its own X-Frame-Options, Referrer-Policy and X-Content-Type-Options
    # (next.config.ts). HSTS belongs here, because only this layer knows TLS is on.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Challenge 2 accepts a 20MB PDF, and the server action wrapping it adds overhead.
    # nginx's default is 1MB, which would reject every report with a 413 before the
    # application ever saw it.
    client_max_body_size 25m;

    # An upload from a venue on poor wifi can be slow without being stuck.
    client_body_timeout 120s;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://wtq_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the application believes every request arrived over http and
        # will not set its Secure session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Next.js streams server-rendered HTML. Buffering it would hold each page back
        # until it was complete, which on the challenge workspace is exactly wrong.
        proxy_buffering off;
    }

    # Immutable build assets: hashed filenames, so a long cache is safe and takes the
    # static load off Node entirely.
    location /_next/static/ {
        proxy_pass http://wtq_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
